name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: ingestion (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e './ingestion[dev]'
      - name: Lint (ruff)
        run: ruff check ingestion
      - name: Test (pytest)
        run: pytest ingestion/tests -q
        env:
          GCP_PROJECT: test
          BQ_LOCATION: EU

  api:
    name: api (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test (vitest)
        run: npm test
