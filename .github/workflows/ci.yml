name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: ingestion (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e './ingestion[dev]'
      - name: Lint (ruff)
        run: ruff check ingestion
      - name: Test (pytest)
        run: pytest ingestion/tests -q
        env:
          GCP_PROJECT: test
          BQ_LOCATION: EU

  api:
    name: api (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test (vitest)
        run: npm test
